[project]
name = "frontier-backend"
version = "0.1.0"
description = "Frontier research assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "falkordb>=1.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.35",
    "structlog>=24.4",
    "PyJWT[crypto]>=2.10",
    "openai>=1.50",
    "mcp>=2.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "lxml>=5.0",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
